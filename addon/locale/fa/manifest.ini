summary = "Listen"
description = """کنترل صدای پس‌زمینه از هر مکان. هنگام جابجایی بین برنامه‌ها به‌طور خودکار پنهان می‌شود و با بازگشت شما برمی‌گردد.
کلیدهای میانبر:
ALT+Windows+L
یک‌بار فشردن: باز کردن حالت Listen
دوبار فشردن: بستن حالت Listen
تمام دستورات کنترلی موجود در حالت لایه‌ای در راهنمای کاربر افزونه مستند شده‌اند"""