summary = "Listen"
description = """যেকোনো স্থান থেকে ব্যাকগ্রাউন্ড অডিও নিয়ন্ত্রণ করুন। টাস্ক পরিবর্তন করলে স্বয়ংক্রিয়ভাবে লুকিয়ে যায়, ফিরে এলে আবার দেখা যায়।
হট কি:
ALT+Windows+L
একবার চাপুন: Listen মোড খুলুন
দুবার চাপুন: Listen মোд বন্ধ করুন
লেয়ার মোডে উপলব্ধ সমস্ত নিয়ন্ত্রণ কমান্ড অ্যাড-অন ব্যবহারকারী গাইডে নথিবদ্ধ করা হয়েছে"""