summary = "Listen"
description = """Hintergrund-Audio von überall aus steuern. Wird beim Aufgabenwechsel automatisch ausgeblendet und kehrt zurück, wenn Sie zurück sind.
Tastenkombinationen:
ALT+Windows+L
Einmaliges Drücken: Listen-Modus öffnen
Doppeltes Drücken: Listen-Modus schließen
Alle im Layer-Modus verfügbaren Steuerbefehle sind im Add-on-Benutzerhandbuch dokumentiert"""