summary = "Listen"
description = """कहीं से भी बैकग्राउंड ऑडियो नियंत्रित करें। जब आप कार्य बदलते हैं तो स्वचालित रूप से छिप जाता है, वापस आने पर वापस आ जाता है।
हॉट कीज़:
ALT+Windows+L
एक बार दबाएं: Listen मोड खोलें
दो बार दबाएं: Listen मोड बंद करें
लेयर मोड में उपलब्ध सभी नियंत्रण कमांड ऐड-ऑन उपयोगकर्ता गाइड में प्रलेखित हैं"""